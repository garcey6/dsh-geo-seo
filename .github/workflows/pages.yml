name: pages

on:
  # Creating the Pages site needs repo-admin rights, which GITHUB_TOKEN does not have,
  # so the site is enabled once by hand in Settings -> Pages (Source: GitHub Actions).
  # After that, every index change redeploys automatically.
  push:
    branches: [main]
    paths:
      - market/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on the first run, so no manual setting is needed.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: market
      - id: deployment
        uses: actions/deploy-pages@v4