name: pages

on:
  # Manual only: creating the Pages site needs repo-admin rights, which GITHUB_TOKEN does
  # not have (configure-pages answers "Get Pages site failed"). Until an admin enables
  # Settings -> Pages -> Source: GitHub Actions, every push-triggered run fails at the
  # deploy step, so the trigger is left manual. Enable Pages, then run this workflow.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: market
      - id: deployment
        uses: actions/deploy-pages@v4