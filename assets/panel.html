<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GEO / SEO</title>
<style>

    :root {
      --bg:#f6f7fb; --panel:#fff; --line:#e3e6ef; --text:#1b1f2a; --muted:#6b7280;
      --accent:#4f6ef7; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
      --p-high:#dc2626; --p-medium:#f59e0b; --p-low:#9ca3af;
      --radius:8px;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#14161c; --panel:#1b1e26; --line:#2b2f3a; --text:#e6e8ee; --muted:#9aa0ad; }
    }
    * { box-sizing:border-box; }
    html, body { margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font:14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .shell { max-width:720px; margin:0 auto; padding:16px 16px 32px; display:flex; flex-direction:column; gap:24px; }
    header.topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { display:flex; align-items:center; gap:8px; font-weight:700; font-size:16px; letter-spacing:0.2px; }
    .brand .mark { width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg,#6366f1,#8b5cf6); display:grid; place-items:center; color:#fff; }
    .top-actions { display:flex; gap:8px; }
    button { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); padding:6px 12px; }
    button:hover { border-color:#b9c0d4; }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
    button.ghost { background:transparent; }
    button.small { padding:3px 8px; font-size:12px; }
    button:disabled { opacity:0.55; cursor:not-allowed; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
    .picker { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px 16px; display:flex; flex-direction:column; gap:8px; }
    .picker-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .picker-name { font-weight:600; overflow-wrap:anywhere; }
    .picker-status { color:var(--muted); font-size:12px; }
    details.advanced { font-size:12px; color:var(--muted); }
    details.advanced input { width:100%; margin-top:6px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
    .banner { border-radius:var(--radius); padding:10px 12px; font-size:13px; border:1px solid; }
    .banner.error { background:rgba(220,38,38,0.08); border-color:rgba(220,38,38,0.35); }
    .banner.warn { background:rgba(217,119,6,0.10); border-color:rgba(217,119,6,0.35); }
    .banner details { margin-top:6px; }
    .hero { display:flex; flex-direction:column; gap:12px; }
    .hero-main { display:flex; gap:16px; align-items:center; }
    .ring { width:96px; height:96px; flex:0 0 96px; }
    .verdict { font-size:17px; font-weight:700; }
    .verdict-sub { color:var(--muted); font-size:12px; margin-top:4px; }
    .hero-meta { color:var(--muted); font-size:12px; }
    details.dims summary { cursor:pointer; color:var(--muted); font-size:12px; }
    .dim { display:grid; grid-template-columns:1fr auto; gap:4px 12px; margin-top:8px; }
    .dim-bar { grid-column:1 / -1; height:6px; border-radius:99px; background:var(--line); overflow:hidden; }
    .dim-bar span { display:block; height:100%; background:var(--accent); }
    .issues { display:flex; flex-direction:column; gap:12px; }
    .issues-head { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
    .issues-head h2 { font-size:15px; margin:0; }
    .issue { background:var(--panel); border:1px solid var(--line); border-left-width:3px; border-radius:var(--radius); padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
    .issue.high { border-left-color:var(--p-high); }
    .issue.medium { border-left-color:var(--p-medium); }
    .issue.low { border-left-color:var(--p-low); }
    .issue-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .tag { font-size:11px; padding:1px 7px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
    .tag.high { color:#fff; background:var(--p-high); border-color:var(--p-high); }
    .tag.medium { color:#3a2400; background:var(--p-medium); border-color:var(--p-medium); }
    .tag.low { color:var(--text); background:rgba(156,163,175,0.3); }
    .issue h3 { margin:0; font-size:14px; }
    .issue p { margin:0; font-size:13px; color:var(--muted); }
    .issue .impact { color:var(--text); }
    .locs { display:flex; flex-wrap:wrap; gap:6px; }
    .loc { font:12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:2px 6px; }
    .prompt-box { background:var(--bg); border:1px dashed var(--line); border-radius:8px; padding:8px 10px; font-size:13px; white-space:pre-wrap; }
    .prompt-actions { display:flex; justify-content:flex-end; gap:8px; }
    .empty { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:20px; text-align:center; color:var(--muted); }
    details.acc { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); }
    details.acc > summary { list-style:none; cursor:pointer; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:8px; font-weight:600; }
    details.acc > summary::-webkit-details-marker { display:none; }
    details.acc > summary .chev { color:var(--muted); font-size:12px; }
    .acc-body { padding:0 16px 16px; display:flex; flex-direction:column; gap:12px; }
    .badge { font-size:12px; font-weight:600; padding:1px 8px; border-radius:99px; border:1px solid var(--line); }
    .badge.ok { color:var(--ok); border-color:rgba(22,163,74,0.4); }
    .badge.warn { color:var(--warn); border-color:rgba(217,119,6,0.4); }
    .badge.bad { color:var(--bad); border-color:rgba(220,38,38,0.4); }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-weight:600; font-size:12px; }
    td.mono, .mono { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; }
    .row-actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .check-group h4 { margin:0 0 6px; font-size:13px; }
    .check { display:flex; align-items:center; gap:8px; padding:3px 0; font-size:13px; }
    .check .mark { width:16px; text-align:center; }
    .check.ok .mark { color:var(--ok); }
    .check.bad .mark { color:var(--bad); }
    .check .note { margin-left:auto; }
    .note { font-size:12px; color:var(--muted); }
    .qlist { max-height:260px; overflow:auto; border:1px solid var(--line); border-radius:8px; padding:6px 8px; display:flex; flex-direction:column; gap:4px; }
    .qrow { display:flex; align-items:center; gap:8px; font-size:12px; }
    .qrow .qtext { flex:1; }
    .qrow label { display:flex; align-items:center; gap:3px; color:var(--muted); }
    footer.foot { color:var(--muted); font-size:11px; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
    .modal { position:fixed; inset:0; background:rgba(15,18,26,0.55); display:grid; place-items:center; padding:16px; z-index:20; }
    .modal-box { background:var(--panel); border-radius:12px; border:1px solid var(--line); width:100%; max-width:640px; max-height:80vh; display:flex; flex-direction:column; overflow:hidden; }
    .modal-box header { padding:10px 14px; border-bottom:1px solid var(--line); font-weight:600; display:flex; justify-content:space-between; align-items:center; }
    .modal-box pre { margin:0; padding:12px 14px; overflow:auto; font-size:12px; flex:1; background:var(--bg); white-space:pre-wrap; }
    .modal-box footer { padding:10px 14px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; }
    .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#111827; color:#fff; border-radius:99px; padding:6px 14px; font-size:12px; z-index:30; }
    [hidden] { display:none !important; }
    @media (max-width:600px) {
      .hero-main { flex-direction:column; align-items:flex-start; }
      .shell { gap:16px; padding:12px; }
    }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="mark" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 20 20"/></svg>
    </span><span>GEO / SEO</span></div>
    <div class="top-actions">
      <button id="langBtn" class="small" type="button">EN</button>
      <button id="refreshBtn" class="small" type="button" title="Rescan">&#8635;</button>
    </div>
  </header>

  <section class="picker">
    <div class="picker-row">
      <div class="picker-name" id="dirName">&mdash;</div>
      <button id="chooseBtn" class="primary" type="button">选择文件夹</button>
    </div>
    <div class="picker-status" id="dirStatus"></div>
    <details id="advanced" class="advanced">
      <summary id="advancedSummary">高级</summary>
      <div class="row-actions" style="margin-top:6px">
        <input id="dirInput" type="text" placeholder="/path/to/project" spellcheck="false" style="flex:1" />
        <button id="applyDir" class="small" type="button">扫描</button>
      </div>
    </details>
  </section>

  <div id="error" class="banner error" hidden></div>

  <section id="hero" class="hero card" hidden></section>

  <section id="issues" class="issues" hidden></section>

  <details id="assetsSec" class="acc" hidden>
    <summary><span id="assetsTitle">资产生成</span><span class="row-actions"><span id="assetsBadge" class="badge"></span><span class="chev">&#9662;</span></span></summary>
    <div id="assetsBody" class="acc-body"></div>
  </details>

  <details id="reachSec" class="acc" hidden>
    <summary><span id="reachTitle">可抓取性</span><span class="row-actions"><span id="reachBadge" class="badge"></span><span class="chev">&#9662;</span></span></summary>
    <div id="reachBody" class="acc-body"></div>
  </details>

  <details id="monitorSec" class="acc" hidden>
    <summary><span id="monitorTitle">可见性监测</span><span class="row-actions"><span id="monitorBadge" class="badge"></span><span class="chev">&#9662;</span></span></summary>
    <div id="monitorBody" class="acc-body"></div>
  </details>

  <footer class="foot"><span id="footLeft"></span><span id="footRight">dsh-geo-seo</span></footer>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <header><span id="modalTitle"></span><button id="modalClose" class="small" type="button">关闭</button></header>
    <pre id="modalPre"></pre>
    <footer><button id="modalDone" class="small" type="button">关闭</button></footer>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<script>

(function () {
  'use strict';

  var LS_LANG = 'geo-seo:lang';
  var LS_DIR = 'geo-seo:lastDir';

  var STRINGS = {
    en: {
      chooseFolder: 'Select folder', advanced: 'Advanced', scan: 'Scan', rescan: 'Rescan',
      scanning: 'Scanning...', idle: 'No project selected yet', pickPrompt: 'Choose your project folder to start.',
      missingDir: 'Folder not found',
      noPackage: 'No package.json here: the scan still runs, but version facts are missing.',
      partial: 'Some files could not be parsed.',
      requestFailed: 'Request failed', viewDetails: 'View details',
      heroRulePack: 'rule pack', docs: 'docs', files: 'files', dims: 'Dimension breakdown',
      issues: 'Issues and fixes', issueCount: '{n} to fix', noIssues: 'Nothing to fix',
      noIssuesSub: 'All 34 rules ran and found no deduction.',
      priorityHigh: 'High', priorityMedium: 'Medium', priorityLow: 'Low',
      impact: 'Impact', suggestion: 'Suggestion', prompt: 'Recommended prompt',
      copy: 'Copy', copied: 'Copied',
      assets: 'Generated assets', assetsCurrent: 'up to date', assetsMissing: '{n} missing',
      assetsInvalid: 'validation failed', generateAll: 'Generate or update all',
      generateSelected: 'Generate selected', preview: 'Preview',
      file: 'File', status: 'Status', size: 'Size', updated: 'Updated',
      stCurrent: 'current', stMissing: 'missing', stStale: 'outdated',
      crawl: 'Crawlability', crawlPass: '{ok}/{total} passed', crawlTodo: '{n} to fix',
      intl: 'International engines', cn: 'Domestic engines',
      crawlNote: 'robots.txt allowing a crawler only means it may fetch. Doubao, DeepSeek, Yuanbao and Kimi mostly rely on server-side retrieval, so an allow-list is not a citation.',
      monitor: 'Visibility monitoring', monitorRuns: '{n} samples', addSample: 'Add a sample',
      platform: 'Platform', questions: 'Questions', mentioned: 'Mentioned', cited: 'Cited',
      submitSample: 'Record sample', selectAll: 'All', clear: 'Clear',
      trend: 'Trend', records: 'Samples', exportRuns: 'Export', importRuns: 'Import', notes: 'Notes',
      lowSample: 'Fewer than 20 samples: read the trend as indicative only.',
      noSamples: 'No samples recorded yet.',
      generatedAt: 'Generated', recordRulePack: 'Rule pack',
      sampleSaved: 'Sample recorded', imported: 'Imported {n} samples',
      previewEmpty: 'This asset has not been generated yet.', close: 'Close',
      verdictPerfect: 'Excellent: AI can read it accurately',
      verdictGood: 'Good: {n} small fixes left',
      verdictFair: 'Fair: {n} key facts missing',
      verdictPoor: 'Needs work: the core facts are missing',
      verdictCapped: 'Compliance risk: the total is capped at 60',
      verdictFewDocs: 'Too few documents to judge',
    },
    zh: {
      chooseFolder: '选择文件夹', advanced: '高级', scan: '扫描', rescan: '重新扫描',
      scanning: '扫描中...', idle: '尚未选择项目', pickPrompt: '选择项目文件夹后开始扫描。',
      missingDir: '目录不存在',
      noPackage: '这个目录没有 package.json，仍可扫描，但版本类事实会缺失。',
      partial: '部分文件解析失败。',
      requestFailed: '请求失败', viewDetails: '查看详情',
      heroRulePack: '规则包', docs: '文档', files: '文件', dims: '查看维度明细',
      issues: '问题与建议', issueCount: '{n} 项', noIssues: '未发现可优化项',
      noIssuesSub: '34 条规则已全部检查',
      priorityHigh: '高', priorityMedium: '中', priorityLow: '低',
      impact: '影响', suggestion: '建议', prompt: '推荐提示词',
      copy: '复制', copied: '已复制',
      assets: '资产生成', assetsCurrent: '已是最新', assetsMissing: '缺 {n} 个',
      assetsInvalid: '校验未通过', generateAll: '生成或更新全部',
      generateSelected: '仅生成选中', preview: '预览',
      file: '文件', status: '状态', size: '大小', updated: '生成时间',
      stCurrent: '最新', stMissing: '未生成', stStale: '内容不一致',
      crawl: '可抓取性', crawlPass: '{ok}/{total} 通过', crawlTodo: '{n} 项待处理',
      intl: '国际搜索引擎', cn: '国内搜索引擎',
      crawlNote: 'robots.txt 放行不代表国内引擎一定能引用。豆包 / DeepSeek / 元宝 / Kimi 主要依赖服务端检索。',
      monitor: '可见性监测', monitorRuns: '已记录 {n} 次', addSample: '新增一次采样',
      platform: '平台', questions: '问题', mentioned: '提及', cited: '引用',
      submitSample: '记录本次采样', selectAll: '全选', clear: '清空',
      trend: '趋势', records: '采样记录', exportRuns: '导出', importRuns: '导入', notes: '说明',
      lowSample: '样本不足 20 次，趋势仅供参考。',
      noSamples: '还没有采样记录。',
      generatedAt: '生成于', recordRulePack: '规则包',
      sampleSaved: '已记录本次采样', imported: '已导入 {n} 条记录',
      previewEmpty: '该文件尚未生成。', close: '关闭',
      verdictPerfect: '优秀 · 可被 AI 准确理解',
      verdictGood: '良好 · 有 {n} 处可微调',
      verdictFair: '中等 · {n} 项关键信息缺失',
      verdictPoor: '待改进 · 核心事实缺失',
      verdictCapped: '存在合规风险 · 总分已封顶 60',
      verdictFewDocs: '文档过少 · 暂不足以判断',
    },
  };

  var state = {
    lang: 'zh', dir: null, dirName: null, status: 'idle', busy: false,
    report: null, durationMs: null, error: null, audit: null, assets: null,
    monitor: null, questions: null, host: null, checked: {},
    form: { platform: 'chatgpt', rows: {} },
  };

  var PRIORITY_RANK = { high: 0, medium: 1, low: 2 };

  function t(key, vars) {
    var table = STRINGS[state.lang] || STRINGS.en;
    var text = table[key] !== undefined ? table[key] : STRINGS.en[key] !== undefined ? STRINGS.en[key] : key;
    if (vars) {
      text = text.replace(/\{([a-zA-Z]+)\}/g, function (match, name) {
        return vars[name] !== undefined ? String(vars[name]) : match;
      });
    }
    return text;
  }

  function $(id) { return document.getElementById(id); }

  function esc(value) {
    return String(value === undefined || value === null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function fmtBytes(bytes) {
    if (typeof bytes !== 'number' || bytes <= 0) return '-';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(1) + ' MB';
  }

  function fmtTime(iso) {
    if (!iso) return '-';
    try {
      return new Date(iso).toLocaleString(state.lang === 'zh' ? 'zh-CN' : 'en-US', { hour12: false });
    } catch (error) { return iso; }
  }

  function pct(value) {
    if (typeof value !== 'number' || !isFinite(value)) return '-';
    return Math.round(value * 100) + '%';
  }

  function apiBase() {
    var href = location.href;
    var query = href.indexOf('?');
    if (query !== -1) href = href.slice(0, query);
    var hash = href.indexOf('#');
    if (hash !== -1) href = href.slice(0, hash);
    var cut = href.lastIndexOf('/panel');
    return cut === -1 ? href : href.slice(0, cut);
  }

  function api(pathname, body) {
    var options = { method: body === undefined ? 'GET' : 'POST', headers: {} };
    if (body !== undefined) {
      options.headers['content-type'] = 'application/json';
      options.body = JSON.stringify(body || {});
    }
    return fetch(apiBase() + pathname, options).then(function (response) {
      return response.json().catch(function () {
        return { ok: false, error: 'unreadable response' };
      }).then(function (payload) {
        if (!payload || payload.ok !== true) {
          var error = new Error(payload && payload.error ? payload.error : 'request failed');
          error.code = payload && payload.code ? payload.code : null;
          error.detail = payload && payload.detail ? payload.detail : null;
          throw error;
        }
        return payload.value;
      });
    });
  }

  var toastTimer = null;
  function toast(message) {
    var node = $('toast');
    node.textContent = message;
    node.hidden = false;
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () { node.hidden = true; }, 2000);
  }

  function basename(dir) {
    if (!dir) return '';
    var parts = String(dir).split(/[\\/]/).filter(function (part) { return part !== ''; });
    return parts.length === 0 ? String(dir) : parts[parts.length - 1];
  }

  function waitForHost(timeoutMs) {
    var started = Date.now();
    return new Promise(function (resolve) {
      function check() {
        if (window.__GEO_HOST__) { resolve(window.__GEO_HOST__); return; }
        if (Date.now() - started >= timeoutMs) { resolve(null); return; }
        window.setTimeout(check, 100);
      }
      check();
    });
  }

  function showError(error) {
    state.error = {
      message: error && error.message ? error.message : String(error),
      code: error && error.code ? error.code : null,
      detail: error && error.detail ? error.detail : null,
    };
    renderError();
  }

  function clearError() { state.error = null; renderError(); }

  function renderError() {
    var node = $('error');
    if (!state.error) { node.hidden = true; node.innerHTML = ''; return; }
    var friendly = state.error.message;
    if (state.error.code === 'not-found' || state.error.code === 'not-a-directory') {
      friendly = t('missingDir') + ': ' + basename(state.error.detail || '');
    }
    var detail = state.error.detail
      ? '<details><summary>' + esc(t('viewDetails')) + '</summary><div class="mono" style="margin-top:4px;overflow-wrap:anywhere">' + esc(state.error.detail) + '</div></details>'
      : '';
    node.innerHTML = '<strong>' + esc(t('requestFailed')) + '</strong>: ' + esc(friendly) + detail;
    node.hidden = false;
  }

  function ring(score) {
    var color = score >= 85 ? 'var(--ok)' : score >= 70 ? 'var(--warn)' : 'var(--bad)';
    var radius = 42;
    var circumference = 2 * Math.PI * radius;
    var filled = (circumference * Math.max(0, Math.min(100, score))) / 100;
    return '<svg class="ring" viewBox="0 0 96 96" role="img" aria-label="' + esc(score.toFixed(1)) + ' / 100">' +
      '<circle cx="48" cy="48" r="' + radius + '" fill="none" stroke="var(--line)" stroke-width="8"/>' +
      '<circle cx="48" cy="48" r="' + radius + '" fill="none" stroke="' + color + '" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + filled + ' ' + circumference + '" transform="rotate(-90 48 48)"/>' +
      '<text x="48" y="49" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="700" fill="currentColor">' + esc(score.toFixed(1)) + '</text>' +
      '<text x="48" y="67" text-anchor="middle" font-size="10" fill="var(--muted)">/ 100</text></svg>';
  }

  function verdict(report) {
    var summary = report.summary;
    if (summary.capped) return t('verdictCapped');
    if (summary.documents < 2) return t('verdictFewDocs');
    if (summary.total >= 85) return t('verdictPerfect');
    if (summary.total >= 70) return t('verdictGood', { n: report.findings.length });
    if (summary.total >= 50) return t('verdictFair', { n: report.findings.length });
    return t('verdictPoor');
  }

  function renderDirBar() {
    $('dirName').textContent = state.dirName || t('idle');
    $('chooseBtn').textContent = state.busy ? t('scanning') : t('chooseFolder');
    $('chooseBtn').disabled = state.busy;
    $('refreshBtn').disabled = state.busy || !state.dir;
    $('advancedSummary').textContent = t('advanced');
    $('applyDir').textContent = t('scan');
    var status = '';
    if (state.busy) status = t('scanning');
    else if (!state.dir) status = t('pickPrompt');
    else if (state.status === 'no-package') status = t('noPackage');
    else if (state.status === 'partial') status = t('partial');
    else if (state.report) {
      status = state.report.summary.documents + ' ' + t('docs') + ' · ' + state.report.summary.filesScanned + ' ' + t('files');
    }
    $('dirStatus').textContent = status;
  }

  function renderHero() {
    var node = $('hero');
    var report = state.report;
    if (!report) { node.hidden = true; node.innerHTML = ''; return; }
    var summary = report.summary;
    var dims = report.dimensions.map(function (dimension) {
      var width = dimension.weight === 0 ? 0 : (dimension.score / dimension.weight) * 100;
      return '<div class="dim"><span>' + esc(dimension.label) + '</span><span class="mono">' + esc(dimension.score) + ' / ' + esc(dimension.weight) + '</span>' +
        '<div class="dim-bar"><span style="width:' + Math.max(0, Math.min(100, width)) + '%"></span></div></div>';
    }).join('');
    node.innerHTML = '<div class="hero-main">' + ring(summary.total) +
      '<div><div class="verdict">' + esc(verdict(report)) + '</div>' +
      '<div class="verdict-sub">' + esc(summary.documents + ' ' + t('docs') + ' · ' + summary.filesScanned + ' ' + t('files') + ' · ' + (state.durationMs || 0) + ' ms') + '</div>' +
      '<div class="hero-meta">' + esc(t('heroRulePack') + ' ' + report.rulePackVersion) + '</div>' +
      '</div></div>' +
      '<details class="dims"><summary>' + esc(t('dims')) + '</summary>' + dims + '</details>';
    node.hidden = false;
  }

  function anchorButtons(anchors) {
    return (anchors || []).map(function (anchor) {
      var label = anchor.file + (anchor.line ? ':' + anchor.line : '');
      return '<button type="button" class="loc" data-act="open" data-file="' + esc(anchor.file) + '" data-line="' + esc(anchor.line || '') + '">' + esc(label) + '</button>';
    }).join('');
  }

  function renderIssues() {
    var node = $('issues');
    var report = state.report;
    if (!report) { node.hidden = true; node.innerHTML = ''; return; }
    var findings = report.findings.slice().sort(function (a, b) {
      var rankA = PRIORITY_RANK[a.priority] === undefined ? 9 : PRIORITY_RANK[a.priority];
      var rankB = PRIORITY_RANK[b.priority] === undefined ? 9 : PRIORITY_RANK[b.priority];
      if (rankA !== rankB) return rankA - rankB;
      if (b.deduction !== a.deduction) return b.deduction - a.deduction;
      return String(a.anchors[0] && a.anchors[0].file).localeCompare(String(b.anchors[0] && b.anchors[0].file));
    });

    var head = '<div class="issues-head"><h2>' + esc(t('issues')) + '</h2><span class="note">' +
      (findings.length === 0 ? esc(t('noIssuesSub')) : esc(t('issueCount', { n: findings.length }))) + '</span></div>';

    if (findings.length === 0) {
      node.innerHTML = head + '<div class="empty"><div style="font-size:20px">✅</div><div>' + esc(t('noIssues')) + '</div><div class="note">' + esc(t('noIssuesSub')) + '</div></div>';
      node.hidden = false;
      return;
    }

    node.innerHTML = head + findings.map(function (finding, index) {
      var priorityLabel = finding.priority === 'high' ? t('priorityHigh') : finding.priority === 'medium' ? t('priorityMedium') : t('priorityLow');
      var impact = state.lang === 'zh' ? finding.impactZh : finding.impact;
      var prompt = state.lang === 'zh' ? finding.promptZh : finding.prompt;
      return '<article class="issue ' + esc(finding.priority) + '">' +
        '<div class="issue-top"><span class="tag ' + esc(finding.priority) + '">' + esc(priorityLabel) + '</span>' +
        '<span class="tag">' + esc(finding.ruleId) + '</span>' +
        '<span class="tag">-' + esc(finding.deduction) + '</span>' +
        (finding.gate ? '<span class="tag high">gate</span>' : '') + '</div>' +
        '<h3>' + esc(finding.title) + '</h3>' +
        (finding.detail ? '<p>' + esc(finding.detail) + '</p>' : '') +
        (impact ? '<p class="impact">' + esc(t('impact')) + ': ' + esc(impact) + '</p>' : '') +
        '<p>' + esc(t('suggestion')) + ': ' + esc(finding.suggestion) + '</p>' +
        '<div class="locs">' + anchorButtons(finding.anchors) + '</div>' +
        '<div class="prompt-box">' + esc(prompt) + '</div>' +
        '<div class="prompt-actions"><button type="button" class="small" data-act="copy" data-index="' + index + '">' + esc(t('copy')) + '</button></div>' +
        '</article>';
    }).join('');
    node.hidden = false;
  }

  function assetBadge() {
    var assets = state.assets;
    if (!assets) return { text: '', kind: '' };
    var files = assets.files || [];
    var missing = files.filter(function (file) { return file.status === 'missing'; }).length;
    var stale = files.filter(function (file) { return file.status === 'stale'; }).length;
    var verification = assets.verification || {};
    if (verification.ok === false) return { text: t('assetsInvalid'), kind: 'bad' };
    if (missing > 0) return { text: t('assetsMissing', { n: missing }), kind: 'warn' };
    if (stale > 0) return { text: t('assetsMissing', { n: stale }), kind: 'warn' };
    return { text: t('assetsCurrent'), kind: 'ok' };
  }

  function renderAssets() {
    var section = $('assetsSec');
    var assets = state.assets;
    if (!state.report || !assets) { section.hidden = true; return; }
    var badge = assetBadge();
    $('assetsTitle').textContent = t('assets');
    var badgeNode = $('assetsBadge');
    badgeNode.textContent = badge.text;
    badgeNode.className = 'badge ' + badge.kind;

    var rows = (assets.files || []).map(function (file) {
      var statusText = file.status === 'current' ? t('stCurrent') : file.status === 'missing' ? t('stMissing') : t('stStale');
      return '<tr><td><input type="checkbox" data-act="check-asset" data-name="' + esc(file.name) + '"' + (state.checked[file.name] ? ' checked' : '') + ' /></td>' +
        '<td class="mono">' + esc(file.name) + '</td>' +
        '<td>' + esc(statusText) + (file.reason ? '<div class="note">' + esc(file.reason) + '</div>' : '') + '</td>' +
        '<td class="mono">' + esc(fmtBytes(file.bytes)) + '</td>' +
        '<td class="mono">' + esc(fmtTime(file.generatedAt)) + '</td>' +
        '<td><button type="button" class="small" data-act="preview" data-name="' + esc(file.name) + '">' + esc(t('preview')) + '</button></td></tr>';
    }).join('');

    var mismatches = assets.verification && Array.isArray(assets.verification.mismatches) && assets.verification.mismatches.length > 0
      ? '<div class="banner warn">' + assets.verification.mismatches.map(function (item) {
          return '<div>' + esc(item.kind) + ': ' + esc(item.claim) + ' - ' + esc(item.evidence) + '</div>';
        }).join('') + '</div>'
      : '';

    $('assetsBody').innerHTML = '<table><thead><tr><th></th><th>' + esc(t('file')) + '</th><th>' + esc(t('status')) + '</th><th>' + esc(t('size')) + '</th><th>' + esc(t('updated')) + '</th><th></th></tr></thead><tbody>' +
      rows + '</tbody></table>' + mismatches +
      '<div class="row-actions"><button type="button" class="primary small" data-act="generate-all">' + esc(t('generateAll')) + '</button>' +
      '<button type="button" class="small" data-act="generate-selected">' + esc(t('generateSelected')) + '</button></div>';
    section.hidden = false;
  }

  function sparkline(points) {
    if (!points || points.length < 2) return '';
    var width = 260;
    var height = 48;
    var values = points.map(function (point) { return typeof point.mentionRate === 'number' ? point.mentionRate : 0; });
    var step = width / (values.length - 1);
    var poly = values.map(function (value, index) {
      return (index * step).toFixed(1) + ',' + (height - value * height).toFixed(1);
    }).join(' ');
    return '<svg viewBox="0 0 ' + width + ' ' + height + '" width="100%" height="' + height + '" preserveAspectRatio="none">' +
      '<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="' + poly + '" /></svg>';
  }

  function renderReach() {
    var section = $('reachSec');
    var audit = state.audit;
    if (!state.report || !audit) { section.hidden = true; return; }
    $('reachTitle').textContent = t('crawl');
    var checks = audit.checks || [];
    var failed = checks.filter(function (check) { return !check.ok; }).length;
    var badgeNode = $('reachBadge');
    badgeNode.textContent = failed === 0 ? t('crawlPass', { ok: checks.length, total: checks.length }) : t('crawlTodo', { n: failed });
    badgeNode.className = 'badge ' + (failed === 0 ? 'ok' : 'warn');

    function group(scope, label) {
      var items = checks.filter(function (check) { return check.scope === scope; });
      var rows = items.map(function (check) {
        var title = state.lang === 'zh' ? check.titleZh : check.title;
        return '<div class="check ' + (check.ok ? 'ok' : 'bad') + '"><span class="mark">' + (check.ok ? '✓' : '✗') + '</span><span>' + esc(title) + '</span><span class="note mono">' + esc(check.id) + '</span></div>';
      }).join('');
      return '<div class="check-group"><h4>' + esc(label) + ' (' + items.length + ')</h4>' + rows + '</div>';
    }

    var notes = (audit.notes || []).map(function (note) { return '<div class="note">• ' + esc(note) + '</div>'; }).join('');
    $('reachBody').innerHTML = group('international', t('intl')) + group('domestic', t('cn')) +
      '<div class="note">' + esc(t('crawlNote')) + '</div>' +
      (notes === '' ? '' : '<details class="dims"><summary>' + esc(t('notes')) + '</summary>' + notes + '</details>');
    section.hidden = false;
  }

  function renderMonitor() {
    var section = $('monitorSec');
    if (!state.report || !state.monitor) { section.hidden = true; return; }
    var summary = state.monitor.summary || {};
    var runs = state.monitor.runs || [];
    $('monitorTitle').textContent = t('monitor');
    var badgeNode = $('monitorBadge');
    badgeNode.textContent = t('monitorRuns', { n: summary.runs || 0 });
    badgeNode.className = 'badge';

    var questions = state.questions && Array.isArray(state.questions.questions) ? state.questions.questions : [];
    var product = state.report.target && state.report.target.name ? state.report.target.name : basename(state.dir || '');
    var rows = questions.map(function (question) {
      var key = question.id;
      var row = state.form.rows[key] || {};
      var text = String(question.text || '').replace(/\{name\}/g, product);
      return '<div class="qrow"><input type="checkbox" data-act="q-include" data-q="' + esc(key) + '"' + (row.include ? ' checked' : '') + ' />' +
        '<span class="qtext">' + esc(text) + '</span>' +
        '<label><input type="checkbox" data-act="q-mentioned" data-q="' + esc(key) + '"' + (row.mentioned ? ' checked' : '') + ' />' + esc(t('mentioned')) + '</label>' +
        '<label><input type="checkbox" data-act="q-cited" data-q="' + esc(key) + '"' + (row.cited ? ' checked' : '') + ' />' + esc(t('cited')) + '</label></div>';
    }).join('');

    var recordRows = runs.slice().reverse().slice(0, 10).map(function (run) {
      var mentions = (run.answers || []).filter(function (answer) { return answer.mentioned; }).length;
      var citations = (run.answers || []).filter(function (answer) { return answer.cited; }).length;
      var platform = run.answers && run.answers[0] ? run.answers[0].platform : '-';
      return '<tr><td class="mono">' + esc(fmtTime(run.at)) + '</td><td>' + esc(platform) + '</td><td class="mono">' + esc((run.answers || []).length) + '</td><td class="mono">' + esc(mentions) + '</td><td class="mono">' + esc(citations) + '</td></tr>';
    }).join('');

    var lowSample = summary.insufficientSample ? '<div class="banner warn">' + esc(t('lowSample')) + '</div>' : '';
    $('monitorBody').innerHTML = lowSample +
      '<div class="row-actions"><span class="note">' + esc(t('trend')) + ': ' + esc(pct(summary.mentionRate)) + ' / ' + esc(pct(summary.citationRate)) + '</span></div>' +
      sparkline(summary.trend || []) +
      '<div class="row-actions"><select id="platformInput" class="small">' +
      ['chatgpt', 'perplexity', 'copilot', 'doubao', 'deepseek', 'kimi', 'yuanbao', 'other'].map(function (name) {
        return '<option value="' + name + '"' + (state.form.platform === name ? ' selected' : '') + '>' + name + '</option>';
      }).join('') + '</select>' +
      '<button type="button" class="small" data-act="q-all">' + esc(t('selectAll')) + '</button>' +
      '<button type="button" class="small" data-act="q-none">' + esc(t('clear')) + '</button></div>' +
      '<div class="qlist">' + rows + '</div>' +
      '<div class="row-actions"><button type="button" class="primary small" data-act="monitor-submit">' + esc(t('submitSample')) + '</button></div>' +
      '<h4 style="margin:4px 0 0;font-size:13px">' + esc(t('records')) + '</h4>' +
      (runs.length === 0
        ? '<div class="note">' + esc(t('noSamples')) + '</div>'
        : '<table><thead><tr><th>' + esc(t('generatedAt')) + '</th><th>' + esc(t('platform')) + '</th><th>N</th><th>' + esc(t('mentioned')) + '</th><th>' + esc(t('cited')) + '</th></tr></thead><tbody>' + recordRows + '</tbody></table>') +
      '<div class="row-actions"><button type="button" class="small" data-act="export">' + esc(t('exportRuns')) + '</button>' +
      '<button type="button" class="small" data-act="import">' + esc(t('importRuns')) + '</button>' +
      '<input id="importFile" type="file" accept="application/json,.json" hidden /></div>';
    section.hidden = false;
  }

  function renderFooter() {
    var report = state.report;
    $('footLeft').textContent = report
      ? t('generatedAt') + ' ' + fmtTime(report.generatedAt) + ' · ' + t('recordRulePack') + ' ' + report.rulePackVersion
      : 'GEO / SEO';
    $('footRight').textContent = 'dsh-geo-seo';
  }

  function render() {
    renderDirBar();
    renderError();
    renderHero();
    renderIssues();
    renderAssets();
    renderReach();
    renderMonitor();
    renderFooter();
    $('langBtn').textContent = state.lang === 'zh' ? 'EN' : '中';
  }

  function setDir(dir) {
    state.dir = dir;
    state.dirName = basename(dir);
    try { localStorage.setItem(LS_DIR, dir); } catch (error) { /* private mode */ }
  }

  function refreshAuxiliary() {
    var dir = encodeURIComponent(state.dir || '');
    return Promise.all([
      api('/assets?dir=' + dir).then(function (value) { state.assets = value; }).catch(function () { state.assets = null; }),
      api('/audit', { dir: state.dir }).then(function (value) { state.audit = value; }).catch(function () { state.audit = null; }),
      api('/monitor?dir=' + dir).then(function (value) { state.monitor = value; }).catch(function () { state.monitor = null; }),
      api('/questions').then(function (value) { state.questions = value; }).catch(function () { state.questions = null; }),
    ]);
  }

  function scan() {
    if (!state.dir || state.busy) return;
    state.busy = true;
    clearError();
    render();
    api('/check', { dir: state.dir })
      .then(function (payload) {
        state.report = payload.report;
        state.durationMs = payload.durationMs;
        var facts = payload.report.facts || {};
        var hasPackage = facts.version !== undefined || facts.name !== undefined;
        state.status = (payload.report.parseErrors || []).length > 0 ? 'partial' : hasPackage ? 'ready' : 'no-package';
        return refreshAuxiliary();
      })
      .catch(function (error) {
        state.report = null;
        state.audit = null;
        state.assets = null;
        state.monitor = null;
        state.status = 'error';
        showError(error);
      })
      .then(function () {
        state.busy = false;
        render();
      });
  }

  function loadState() {
    return api('/state').then(function (value) {
      if (state.dir === null && value && value.target) setDir(value.target);
    }).catch(function () { /* an empty state is fine */ });
  }

  function chooseFolder() {
    var host = state.host;
    if (!host || typeof host.pickDirectory !== 'function') {
      $('advanced').open = true;
      return;
    }
    host.pickDirectory().then(function (picked) {
      if (!picked) return;
      setDir(picked);
      scan();
    }, function (error) { showError(error); });
  }

  function fallbackCopy(text, done) {
    var area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', 'readonly');
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    try { document.execCommand('copy'); done(); } catch (error) { toast(t('requestFailed')); }
    document.body.removeChild(area);
  }

  function copyText(text, button) {
    function done() {
      toast(t('copied') + ' ✓');
      if (button) {
        var original = button.textContent;
        button.textContent = t('copied') + ' ✓';
        window.setTimeout(function () { button.textContent = original; }, 2000);
      }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
      return;
    }
    fallbackCopy(text, done);
  }

  function openFile(file, line) {
    var host = state.host;
    var label = file + (line ? ':' + line : '');
    if (host && typeof host.openFile === 'function') {
      host.openFile(file, line ? Number(line) : undefined).then(function (opened) {
        if (!opened) copyText(label, null);
      }, function () { copyText(label, null); });
      return;
    }
    copyText(label, null);
  }

  function generate(names) {
    if (!state.dir || state.busy) return;
    state.busy = true;
    render();
    api('/generate', { dir: state.dir, force: true, files: names || [] })
      .then(function (result) {
        state.generate = result;
        return api('/assets?dir=' + encodeURIComponent(state.dir)).then(function (value) { state.assets = value; });
      })
      .then(function () { toast(t('assetsCurrent')); }, function (error) { showError(error); })
      .then(function () { state.busy = false; render(); });
  }

  function preview(name) {
    api('/preview?dir=' + encodeURIComponent(state.dir || '') + '&name=' + encodeURIComponent(name))
      .then(function (value) {
        $('modalTitle').textContent = name;
        $('modalPre').textContent = value && typeof value.content === 'string' ? value.content : t('previewEmpty');
        $('modal').hidden = false;
      })
      .catch(function (error) { toast(error && error.message ? error.message : t('previewEmpty')); });
  }

  function submitSample() {
    if (!state.dir || state.busy) return;
    var platformInput = $('platformInput');
    var platform = platformInput ? platformInput.value : state.form.platform;
    state.form.platform = platform;
    var answers = [];
    Object.keys(state.form.rows).forEach(function (questionId) {
      var row = state.form.rows[questionId];
      if (!row || !row.include) return;
      answers.push({ questionId: questionId, platform: platform, mentioned: Boolean(row.mentioned), cited: Boolean(row.cited) });
    });
    if (answers.length === 0) { toast(t('selectAll')); return; }
    state.busy = true;
    api('/monitor', { dir: state.dir, platform: platform, answers: answers })
      .then(function (value) { state.monitor = value; toast(t('sampleSaved')); }, function (error) { showError(error); })
      .then(function () { state.busy = false; render(); });
  }

  function exportRuns() {
    var runs = state.monitor && Array.isArray(state.monitor.runs) ? state.monitor.runs : [];
    var blob = new Blob([JSON.stringify({ runs: runs }, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = 'geo-seo-monitor.json';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  function importRuns(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try { parsed = JSON.parse(String(reader.result)); } catch (error) { toast(t('requestFailed')); return; }
      var runs = Array.isArray(parsed) ? parsed : parsed && Array.isArray(parsed.runs) ? parsed.runs : [];
      if (runs.length === 0) { toast(t('requestFailed')); return; }
      api('/monitor/import', { dir: state.dir, runs: runs }).then(function (value) {
        state.monitor = value;
        toast(t('imported', { n: runs.length }));
        render();
      }, function (error) { showError(error); });
    };
    reader.readAsText(file);
  }

  function setRow(questionId, key, value) {
    var row = state.form.rows[questionId] || {};
    row[key] = value;
    state.form.rows[questionId] = row;
  }

  document.addEventListener('click', function (event) {
    var target = event.target;
    if (!(target instanceof Element)) return;
    if (target.id === 'chooseBtn') { chooseFolder(); return; }
    if (target.id === 'refreshBtn') { scan(); return; }
    if (target.id === 'applyDir') {
      var typed = $('dirInput').value.trim();
      if (typed) { setDir(typed); scan(); }
      return;
    }
    if (target.id === 'langBtn') {
      state.lang = state.lang === 'zh' ? 'en' : 'zh';
      try { localStorage.setItem(LS_LANG, state.lang); } catch (error) { /* private mode */ }
      render();
      return;
    }
    if (target.id === 'modalClose' || target.id === 'modalDone' || target.id === 'modal') {
      $('modal').hidden = true;
      return;
    }
    var actionNode = target.closest('[data-act]');
    if (!actionNode) return;
    var act = actionNode.getAttribute('data-act');
    if (act === 'open') {
      event.preventDefault();
      openFile(actionNode.getAttribute('data-file'), actionNode.getAttribute('data-line'));
      return;
    }
    if (act === 'copy') {
      var index = Number(actionNode.getAttribute('data-index'));
      var findings = state.report ? state.report.findings : [];
      var finding = findings[index];
      var text = finding ? (state.lang === 'zh' ? finding.promptZh : finding.prompt) : '';
      copyText(text, actionNode);
      return;
    }
    if (act === 'check-asset') { state.checked[actionNode.getAttribute('data-name')] = actionNode.checked; return; }
    if (act === 'generate-all') { generate(null); return; }
    if (act === 'generate-selected') {
      var names = Object.keys(state.checked).filter(function (name) { return state.checked[name]; });
      if (names.length === 0) { toast(t('generateSelected')); return; }
      generate(names);
      return;
    }
    if (act === 'preview') { preview(actionNode.getAttribute('data-name')); return; }
    if (act === 'q-include' || act === 'q-mentioned' || act === 'q-cited') {
      setRow(actionNode.getAttribute('data-q'), act === 'q-include' ? 'include' : act === 'q-mentioned' ? 'mentioned' : 'cited', actionNode.checked);
      return;
    }
    if (act === 'q-all' || act === 'q-none') {
      var questions = state.questions && Array.isArray(state.questions.questions) ? state.questions.questions : [];
      questions.forEach(function (question) { setRow(question.id, 'include', act === 'q-all'); });
      renderMonitor();
      return;
    }
    if (act === 'monitor-submit') { submitSample(); return; }
    if (act === 'export') { exportRuns(); return; }
    if (act === 'import') {
      var input = $('importFile');
      if (input) input.click();
      return;
    }
  });

  document.addEventListener('change', function (event) {
    var target = event.target;
    if (target && target.id === 'importFile' && target.files && target.files[0]) {
      importRuns(target.files[0]);
      target.value = '';
    }
  });

  function boot() {
    try {
      var savedLang = localStorage.getItem(LS_LANG);
      if (savedLang === 'en' || savedLang === 'zh') state.lang = savedLang;
    } catch (error) { /* private mode */ }
    try {
      state.dir = localStorage.getItem(LS_DIR);
      if (state.dir) state.dirName = basename(state.dir);
    } catch (error) { /* private mode */ }
    render();
    waitForHost(3000).then(function (host) {
      state.host = host;
      var workspace = null;
      if (host && typeof host.getWorkspaceRoot === 'function') {
        try { workspace = host.getWorkspaceRoot(); } catch (error) { workspace = null; }
      }
      // V3 F-R1: the workspace root wins; the remembered folder is the fallback.
      if (workspace && workspace !== state.dir) setDir(workspace);
      if (state.dir) { scan(); return; }
      // Nothing remembered: the server's last target is the only hint left, and it
      // must still be scanned or the page would open blank.
      loadState().then(function () {
        render();
        if (state.dir) scan();
      });
    });
  }

  boot();
})();
</script>
</body>
</html>
